# Copy outside the repository and replace both placeholders.
# Keep the JSON credentials file created by `cloudflared tunnel create` private.
tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: C:\Users\YOUR_WINDOWS_USER\.cloudflared\REPLACE_WITH_TUNNEL_UUID.json

ingress:
  - hostname: status.example.com
    service: http://127.0.0.1:8787
  - service: http_status:404
