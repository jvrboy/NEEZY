[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neezy-market-workspace"
version = "1.7.0"
description = "A native Python market-monitoring desktop workspace"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "NEEZY contributors" }]
dependencies = ["websocket-client>=1.8,<2"]

[project.optional-dependencies]
dev = ["ruff>=0.11"]
research-lab = ["numpy>=1.24,<3"]
local-gguf = ["llama-cpp-python>=0.3.8"]
local-transformers = [
  "torch>=2.2",
  "transformers>=4.50",
  "safetensors>=0.4",
]
local-disk-offload = ["accelerate>=1.0"]
# MT5 on Linux, Termux, Colab, Codespaces: talks RPyC to a Wine-hosted terminal
# (mt5linux server). No MetaTrader5 wheel needed on the client.
mt5-remote = ["rpyc>=6.0,<7"]

[project.scripts]
neezy = "neezy_app.launcher:main"
neezy-cli = "neezy_backend.cli:main"

[tool.setuptools.packages.find]
include = ["neezy_app*", "neezy_backend*"]

[tool.setuptools.package-data]
neezy_backend = ["data/*.json", "data/research_candles/*.json", "lab/sources.json", "lab/vendors/tideforge/LICENSE", "lab/vendors/tideglass/resources/VERSION", "lab/vendors/tideglass/resources/config/*.json", "lab/vendors/tideglass/resources/schemas/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF"]
ignore = ["UP017"]

# Preserve upstream numerical implementations while checking NEEZY adapters strictly.
[tool.ruff.lint.per-file-ignores]
"neezy_backend/lab/vendors/**/*.py" = ["E", "F", "I", "UP", "B", "BLE", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
