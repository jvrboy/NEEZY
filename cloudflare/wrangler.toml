name = "neezy-executor-watchdog"
main = "worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/5 * * * *"]

# Create these resources, replace the id, then set secrets with wrangler:
#   wrangler kv namespace create NEEZY_STATE
#   wrangler r2 bucket create neezy-executor-logs
[[kv_namespaces]]
binding = "NEEZY_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "NEEZY_LOGS"
bucket_name = "neezy-executor-logs"

[vars]
NEEZY_STATUS_URL = "https://status.example.com/api/status"
MAX_HEARTBEAT_SECONDS = "180"

# Secrets (never write values here):
# CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
# ALERT_TELEGRAM_BOT_TOKEN, ALERT_TELEGRAM_CHAT_ID
# Optional email-automation endpoint: ALERT_WEBHOOK_URL
