name: Research workspace checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[research-lab]"
      - run: python -m unittest discover -s tests -p 'test_archive_lab.py' -v
      - run: python -m unittest discover -s tests -p 'test_lab_evaluation.py' -v
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
