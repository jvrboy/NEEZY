name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and tooling
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: ruff check neezy_app neezy_backend tests forex_signals.py main.py scripts
      - name: Check formatting
        run: ruff format --check neezy_app neezy_backend tests forex_signals.py main.py scripts
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test (offline)
        run: |
          neezy-cli --version
          neezy-cli markets --json > /dev/null
          neezy-cli risk EURUSD --balance 10000 --entry 1.1 --stop 1.098
      - name: Build wheel
        run: python -m build --wheel

  cloud-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test watchdog transitions and R2 archiving
        run: node --test cloudflare/worker.test.mjs

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build read-only monitoring dashboard
        working-directory: dashboard
        run: npm run build
