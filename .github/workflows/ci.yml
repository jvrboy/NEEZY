name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and tooling
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: ruff check neezy_app neezy_backend tests forex_signals.py
      - name: Check formatting
        run: ruff format --check neezy_app neezy_backend tests forex_signals.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m build --wheel
