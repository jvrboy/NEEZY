# Ruff gates for staged files (roadmap #72).
# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        name: ruff check
        args: [--fix]
      - id: ruff-format
        name: ruff format
